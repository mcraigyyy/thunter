<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ff6600" />
  <link rel="manifest" href="./manifest.json" />
  
  <link rel="icon" type="image/png" href="./icon.png" />
  <link rel="apple-touch-icon" href="./icon.png" />

  <title>Trophy Hunter</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #ff6600;
      --text: #f5f5f5;
      --text-muted: #a0a0a0;
      --border: #333333;
      --danger: #d9534f;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 16px 16px 80px 16px;
    }
    h1, h2, h3 { color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-top: 0; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    label { display: block; margin-top: 10px; color: var(--text-muted); font-size: 0.9rem; }
    input, select, button { width: 100%; padding: 12px; margin-top: 5px; border-radius: 6px; border: 1px solid var(--border); background-color: #2a2a2a; color: var(--text); box-sizing: border-box; font-size: 1rem; }
    input:focus, select:focus { outline: 2px solid var(--accent); }
    button.btn-primary { background-color: var(--accent); color: #000; font-weight: bold; border: none; margin-top: 15px; cursor: pointer; }
    button.btn-secondary { background-color: transparent; border: 1px solid var(--accent); color: var(--accent); margin-top: 10px; cursor: pointer; }
    button.btn-delete { background-color: transparent; border: 1px solid var(--danger); color: var(--danger); font-size: 0.85rem; padding: 6px 12px; margin-top: 10px; cursor: pointer; width: auto; }
    
    .view-section { display: none; }
    .view-section.active { display: block; }

    .category-group { margin-bottom: 24px; }
    .category-title { border-bottom: 2px solid var(--accent); padding-bottom: 4px; margin-bottom: 12px; font-size: 1.2rem; }
    .entry { border-bottom: 1px solid var(--border); padding: 12px 0; }
    .entry:last-child { border-bottom: none; }
    .entry img { max-width: 100%; border-radius: 6px; margin-top: 8px; display: block; }
    .meta { font-size: 0.85rem; color: var(--text-muted); }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: #1a1a1a;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: bold;
      text-transform: uppercase;
      padding: 0;
      margin: 0;
      height: 100%;
      width: 50%;
      cursor: pointer;
    }
    .nav-btn.active {
      color: var(--accent);
      border-top: 3px solid var(--accent);
    }
  </style>
</head>
<body>

  <div id="homeView" class="view-section active">
    <h1>Trophy Hunter</h1>
    <div class="card">
      <h2>New Log</h2>
      <form id="logForm">
        <label for="category">Category</label>
        <select id="category" required>
          <option value="" disabled selected>Select Category...</option>
          <option value="Foxes">Foxes</option>
          <option value="Cats">Cats</option>
          <option value="Dogs">Dogs</option>
          <option value="Deers">Deers</option>
          <option value="Goats">Goats</option>
          <option value="Pigs">Pigs</option>
        </select>

        <label for="animal">Specific Animal / Details</label>
        <input type="text" id="animal" placeholder="e.g. Red Fox, Fallow Buck" required />

        <label for="weight">Weight (kg / lbs)</label>
        <input type="number" id="weight" step="0.1" placeholder="e.g. 180" required />

        <label for="calibre">Calibre / Firearm</label>
        <input type="text" id="calibre" placeholder="e.g. .308 Win, 12 Gauge" required />

        <label for="location">Location (GPS)</label>
        <input type="text" id="location" placeholder="Coordinates" readonly />
        <button type="button" class="btn-secondary" onclick="getLocation()">Get Current GPS</button>

        <label for="photo">Trophy Photo</label>
        <input type="file" id="photo" accept="image/*" />

        <button type="submit" class="btn-primary">Save Log Entry</button>
      </form>
    </div>
  </div>

  <div id="logsView" class="view-section">
    <h1>Logged Animals</h1>
    <div id="logHistory"></div>
  </div>

  <div class="bottom-nav">
    <button id="navHome" class="nav-btn active" onclick="switchTab('home')">Home Screen</button>
    <button id="navLogs" class="nav-btn" onclick="switchTab('logs')">Logged Animals</button>
  </div>

  <script>
    let db;
    const CATEGORIES = ["Foxes", "Cats", "Dogs", "Deers", "Goats", "Pigs"];

    const request = indexedDB.open("TrophyHunterDB", 1);

    request.onupgradeneeded = function(e) {
      db = e.target.result;
      if (!db.objectStoreNames.contains("logs")) {
        db.createObjectStore("logs", { keyPath: "id" });
      }
    };

    request.onsuccess = function(e) {
      db = e.target.result;
      renderLogs();
    };

    function switchTab(tabName) {
      const homeView = document.getElementById('homeView');
      const logsView = document.getElementById('logsView');
      const navHome = document.getElementById('navHome');
      const navLogs = document.getElementById('navLogs');

      if (tabName === 'home') {
        homeView.classList.add('active');
        logsView.classList.remove('active');
        navHome.classList.add('active');
        navLogs.classList.remove('active');
      } else {
        logsView.classList.add('active');
        homeView.classList.remove('active');
        navLogs.classList.add('active');
        navHome.classList.remove('active');
        renderLogs();
      }
    }

    function getLocation() {
      const locInput = document.getElementById('location');
      if (navigator.geolocation) {
        locInput.placeholder = "Fetching location...";
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            locInput.value = `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
          },
          () => { locInput.placeholder = "Location access denied"; },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      } else {
        locInput.placeholder = "GPS not supported";
      }
    }

    const form = document.getElementById('logForm');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const file = document.getElementById('photo').files[0];

      if (file) {
        const reader = new FileReader();
        reader.onloadend = function() { saveEntry(reader.result); };
        reader.readAsDataURL(file);
      } else {
        saveEntry(null);
      }
    });

    function saveEntry(imageData) {
      const entry = {
        id: Date.now(),
        category: document.getElementById('category').value,
        animal: document.getElementById('animal').value,
        weight: document.getElementById('weight').value,
        calibre: document.getElementById('calibre').value,
        location: document.getElementById('location').value || 'Not recorded',
        date: new Date().toLocaleDateString(),
        photo: imageData
      };

      const tx = db.transaction("logs", "readwrite");
      tx.objectStore("logs").add(entry);
      tx.oncomplete = function() {
        form.reset();
        switchTab('logs');
      };
    }

    function deleteEntry(id) {
      if (confirm("Are you sure you want to delete this log entry?")) {
        const tx = db.transaction("logs", "readwrite");
        tx.objectStore("logs").delete(id);
        tx.oncomplete = function() {
          renderLogs();
        };
      }
    }

    function renderLogs() {
      const tx = db.transaction("logs", "readonly");
      const store = tx.objectStore("logs");
      const request = store.getAll();

      request.onsuccess = function() {
        const logs = request.result;
        const logContainer = document.getElementById('logHistory');
        
        if (logs.length === 0) {
          logContainer.innerHTML = '<div class="card"><p class="meta">No recorded logs yet.</p></div>';
          return;
        }

        let html = '';

        CATEGORIES.forEach(cat => {
          const categoryLogs = logs.filter(log => log.category === cat);
          if (categoryLogs.length > 0) {
            html += `<div class="card category-group">`;
            html += `<div class="category-title"><strong style="color: var(--accent);">${cat}</strong> (${categoryLogs.length})</div>`;
            
            categoryLogs.reverse().forEach(log => {
              html += `
                <div class="entry">
                  <strong style="font-size: 1.05rem;">${log.animal}</strong>
                  <div class="meta">${log.date} • GPS: ${log.location}</div>
                  <p style="margin: 5px 0;"><strong>Weight:</strong> ${log.weight} | <strong>Calibre:</strong> ${log.calibre}</p>
                  ${log.photo ? `<img src="${log.photo}" alt="${log.animal}" />` : ''}
                  <button class="btn-delete" onclick="deleteEntry(${log.id})">Delete Entry</button>
                </div>
              `;
            });

            html += `</div>`;
          }
        });

        logContainer.innerHTML = html || '<div class="card"><p class="meta">No recorded logs yet.</p></div>';
      };
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW Registered'))
          .catch(err => console.error('SW Failed', err));
      });
    }
  </script>
</body>
</html>
